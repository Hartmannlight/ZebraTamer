listen = "0.0.0.0:8080"
data_dir = "/var/lib/zpl-agent"
storage_mode = "full"
mdns_enabled = true
poll_interval_secs = 30
capability_poll_interval_secs = 3600
host_boot_loss_labels = 0
printer_reconnect_loss_labels = 0
calibration_loss_labels = 0
reconnect_debounce_secs = 5
hardware_counters = "prefer"
auto_discover = true
auto_discover_dir = "/dev/usb"
auto_discover_id_prefix = "usb"

[[printers]]
id = "schildkrote"
display_name = "Zebra T402 Schildkröte"
device = "/dev/usb/lp0"
transport = "char_device"
model_hint = "Zebra T402"
bidirectional_queries = true
first_byte_timeout_ms = 1500
idle_timeout_ms = 500
write_timeout_ms = 30000

[[printers]]
id = "ente"
display_name = "Zebra LP 2824 Plus Ente"
device = "/dev/usb/lp1"
transport = "char_device"
model_hint = "Zebra LP 2824 Plus"
bidirectional_queries = false
first_byte_timeout_ms = 1500
idle_timeout_ms = 500
write_timeout_ms = 30000
