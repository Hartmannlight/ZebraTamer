[package]
name = "zpl-agent"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "Headless REST agent for Zebra ZPL printers"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
libc = "0.2"
mdns-sd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
